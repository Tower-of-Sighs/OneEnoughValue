plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'net.neoforged.moddev.legacyforge' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "OneEnoughValue-1.20.1-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://cursemaven.com' }
}

dependencies {
    modImplementation("curse.maven:architectury-api-419699:5137938")
    modImplementation("curse.maven:rhino-416294:6186971")
    modImplementation("curse.maven:kubejs-238086:5853326")
    modRuntimeOnly("curse.maven:probejs-legacy-956446:7411696")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version          : project.forge_version,
            forge_version_range    : project.forge_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add '-parameters'
}

// ---- CurseForge 发布 ----
// token 从 ~/.gradle/gradle.properties 的 curseforge_api_key 读取，CI 走 CURSEFORGE_API_KEY 环境变量
def cfToken = providers.gradleProperty("curseforge_api_key")
        .orElse(providers.environmentVariable("CURSEFORGE_API_KEY"))

tasks.register("checkPublishTokens") {
    doLast {
        println("curseforge=" + cfToken.map { v -> "***" + v.substring(Math.max(0, v.length() - 4)) }.getOrElse("<missing>"))
    }
}

publishMods {
    // 默认干跑，确认无误后临时改 false 真发
    dryRun = true
    file = tasks.named('reobfJar').flatMap { it.archiveFile }
    changelog = providers.gradleProperty("changelog").getOrElse("见 GitHub Release 说明")
    type = STABLE
    modLoaders.add("forge")
    maxRetries = 3

    curseforge {
        // TODO 填入 CurseForge 数字项目 ID（项目 slug 为 one-enough-value）
        projectId = providers.gradleProperty("curseforge_project_id").getOrElse("TODO_PROJECT_ID")
        projectSlug = "one-enough-value"
        accessToken = cfToken
        minecraftVersions.add("1.20.1")
        client = true
        server = true
        javaVersions.add(JavaVersion.VERSION_17)
        changelogType = "markdown"
    }
}
