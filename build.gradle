plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "OneEnoughValue-26.1.2-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://cursemaven.com' }
}

dependencies {
    implementation("curse.maven:kubejs-238086:${project.kubejs_file_id}")
    implementation("curse.maven:rhino-416294:${project.rhino_file_id}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add '-parameters'
}

// ---- CurseForge 发布 ----
// token 从 ~/.gradle/gradle.properties 的 curseforge_api_key 读取，CI 走 CURSEFORGE_API_KEY 环境变量
def cfToken = providers.gradleProperty("curseforge_api_key")
        .orElse(providers.environmentVariable("CURSEFORGE_API_KEY"))

tasks.register("checkPublishTokens") {
    doLast {
        println("curseforge=" + cfToken.map { v -> "***" + v.substring(Math.max(0, v.length() - 4)) }.getOrElse("<missing>"))
    }
}

publishMods {
    // 默认干跑，确认无误后临时改 false 真发
    dryRun = false
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = providers.gradleProperty("changelog").getOrElse("""- 移植至 26.1.2 NeoForge
- 配方取值链路按 26.x 的 SlotDisplay 模型重写
- 基础价值改为数据包驱动
- 额外价值改用函数动态计算""")
    type = BETA
    modLoaders.add("neoforge")
    maxRetries = 3

    curseforge {
        // 项目 slug 为 one-enough-value；ID 也可用 ~/.gradle/gradle.properties 的 curseforge_project_id 覆盖
        projectId = providers.gradleProperty("curseforge_project_id").getOrElse("1413802")
        projectSlug = "one-enough-value"
        accessToken = cfToken
        minecraftVersions.add("26.1.2")
        client = true
        server = true
        javaVersions.add(JavaVersion.VERSION_25)
        changelogType = "markdown"
    }
}
